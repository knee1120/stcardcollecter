<meta name="theme-color" content="#777b80"><title>CardNest · 私人酒馆收藏馆</title>
<style>

button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0}.app{max-width:1440px;margin:auto;padding:22px;display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;min-height:100vh}.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--shadow);border-radius:var(--radius)}.sidebar{padding:22px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:22px;height:calc(100vh - 44px)}.brand{display:flex;align-items:center;gap:12px;padding:4px 7px}.logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 35%,white));display:grid;place-items:center;color:white;font-size:20px}.brand b{font-size:18px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 13px;border-radius:14px;background:transparent;color:var(--muted);transition:.18s}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--accent)}.nav .ico{width:20px;text-align:center;font-size:17px}.sidebottom{margin-top:auto;display:grid;gap:8px}.main{min-width:0;padding:4px 0 28px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 22px}.crumb{color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px;align-items:center}.btn{padding:10px 14px;border-radius:13px;background:var(--panel);border:1px solid var(--line);transition:.18s}.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}.btn.primary{background:var(--accent);color:var(--accentText);border-color:transparent}.btn.small{padding:7px 10px;font-size:13px}.iconbtn{width:40px;height:40px;border-radius:13px;background:var(--panel);border:1px solid var(--line)}.hero{padding:26px 28px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:20px;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:5%;top:-150px;background:color-mix(in srgb,var(--accent) 18%,transparent);filter:blur(3px)}.eyebrow{font-size:11px;letter-spacing:1.6px;color:var(--muted);font-weight:700}.hero h1{font-size:clamp(25px,4vw,36px);margin:7px 0 4px;letter-spacing:-.8px}.hero p{margin:0;color:var(--muted)}.hero .hero-actions{z-index:1;display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{padding:17px 19px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;margin-top:3px;font-weight:650}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 2px 12px}.section-head h2{font-size:17px;margin:0}.section-head p{color:var(--muted);font-size:12px;margin:3px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.resource{padding:13px;min-width:0;cursor:pointer;transition:.2s}.resource:hover{transform:translateY(-3px)}.cover{height:130px;border-radius:15px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 23%,var(--panel)),var(--panel2));display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:34px;margin-bottom:12px}.cover img{width:100%;height:100%;object-fit:cover}.resource h3{font-size:15px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resource .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.chip{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:30px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.field{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px 12px;outline:none;min-width:0}.field:focus{border-color:var(--accent)}.search{flex:1;min-width:180px}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.empty .big{font-size:32px;margin-bottom:8px}.detail{padding:22px}.detailtop{display:flex;gap:18px;align-items:flex-start}.detailcover{width:130px;height:150px;border-radius:17px;background:var(--panel2);display:grid;place-items:center;overflow:hidden;font-size:34px;flex:none}.detailcover img{width:100%;height:100%;object-fit:cover}.detail h1{margin:2px 0 6px;font-size:25px}.detailmeta{color:var(--muted);font-size:13px}.detail-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.editbox{padding:15px}.editbox h3{font-size:13px;margin:0 0 9px;color:var(--muted)}.editbox textarea{width:100%;min-height:90px;resize:vertical;background:transparent;border:0;outline:none}.editbox input{width:100%;background:transparent;border:0;outline:none}.wide{grid-column:1/-1}.modalback{position:fixed;inset:0;background:rgba(15,17,20,.38);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px}.modal h2{margin:0 0 16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.formrow{display:grid;gap:5px}.formrow.full{grid-column:1/-1}.formrow label{font-size:12px;color:var(--muted)}.formrow input,.formrow textarea,.formrow select{width:100%}.formrow textarea{min-height:80px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:30px;z-index:20;box-shadow:var(--shadow);font-size:13px}.settings{padding:20px}.swatches{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:32px;height:32px;border-radius:50%;border:2px solid .idcard .idinfo{min-width:0;display:flex;flex-direction:column;justify-content:center}

.idcard h3{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

ew>img{width:100%;max-height:70vh;object-fit:contain;background:#111}.ig-view>button{justify-self:end}

}.x-name{font-size:12px;font-weight:700}.x-name small{font-weight:400;color:#7a828a}.x-reply-btn{background:transparent;color:#2474b9;font-size:11px;padding:0}.x-inline-reply{display:flex;gap:7px;margin-top:10px}.x-inline-reply input{flex:1;min-width:0;border:1px solid #e5e7e9;border-radius:22px;padding:8px 12px;font-size:12px}.x-inline-reply button{background:#17191c;color:white;border-radius:20px;padding:6px 12px;font-size:12px}

<body>
<div class="app">
<aside class="sidebar glass">
 <div class="brand"><div class="logo">✳</div><div><b>CardNest</b><small>私人酒馆收藏馆</small></div></div>
 <nav class="nav" id="sideNav"></nav>
 <div class="sidebottom"><button class="btn" onclick="openAdd()">＋ 新建收藏</button><button class="btn small" onclick="showPage('settings')">⚙ 设置与备份</button></div>
 <div style="font-size:11px;color:var(--muted);padding:4px 8px">V1 · 数据优先保存在本设备</div>
</aside>
<main class="main">
 <header class="topbar"><div class="crumb" id="crumb">私人收藏馆 / 首页</div><div class="top-actions"><button class="iconbtn" title="切换深色模式" onclick="toggleDark()">◐</button><button class="btn primary" onclick="openAdd()">＋ 添加收藏</button></div></header>
 <div id="view"></div>
</main>
</div>
<nav class="mobilebar glass" id="mobileNav"></nav>
<div class="modalback" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal glass" id="modal"></div></div>
<div id="toast" class="toast hidden"></div>
<input id="fileInput" type="file" accept=".png,.json,.webp,.jpg,.jpeg,.txt,.yaml,.yml" multiple class="hidden">
<input id="backupInput" type="file" accept=".json,application/json" class="hidden">
<script>
const categories=[['home','⌂','首页'],['warehouse','▤','仓库'],['todo','✓','待游玩'],['diary','☷','日记'],['tags','◇','标签管理'],['settings','⚙','备份与设置']];
const resourceTypes=[['character','♙','角色卡库'],['preset','☷','预设库'],['tool','⚒','工具箱'],['inspiration','✧','灵感收藏'],['chat','▤','聊天存档']];
const names=Object.fromEntries([...categories,...resourceTypes].map(x=>[x[0],x[2]]));
let db,items=[],current=null,page='home',filter='全部',query='';
const req=indexedDB.open('CardNestDB',2);
req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});if(!d.objectStoreNames.contains('media'))d.createObjectStore('media',{keyPath:'id'});};
req.onsuccess=async e=>{db=e.target.result;try{await migrateLegacyMedia()}catch(err){console.error('旧图片迁移未完全完成',err);toast('部分旧图片迁移失败，请先导出备份后重试')}await load();render();};

req.onerror=()=>{toast('本地数据库无法打开，请尝试更新浏览器');};
window.addEventListener('DOMContentLoaded',watchMediaImages);
function store(mode='readonly'){return db.transaction('items',mode).objectStore('items')}

function mediaStore(mode='readonly'){return db.transaction('media',mode).objectStore('media')}
const mediaUrlCache=new Map();
function dataUrlToBlob(dataUrl){const parts=String(dataUrl).split(',');const mime=(parts[0].match(/:(.*?);/)||[])[1]||'application/octet-stream';const bin=atob(parts[1]||'');const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type:mime})}
function isDataImage(v){return typeof v==='string'&&/^data:image\\//i.test(v)}
function isMediaRef(v){return typeof v==='string'&&v.startsWith('media://')}
function saveMedia(value,id=uid()){return new Promise((resolve,reject)=>{try{const blob=value instanceof Blob?value:dataUrlToBlob(value);const r=mediaStore('readwrite').put({id,blob,type:blob.type,size:blob.size,created:Date.now()});r.onsuccess=()=>resolve('media://'+id);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
function getMedia(id){return new Promise((resolve,reject)=>{const r=mediaStore().get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function mediaSrc(value){return isMediaRef(value)?value:value||''}
async function hydrateMediaImages(root=document){if(!root)return;const imgs=[...(root.querySelectorAll?.('img[src^="media://"]')||[])];for(const img of imgs){const key=img.getAttribute('src').slice(8);if(mediaUrlCache.has(key)){img.src=mediaUrlCache.get(key);continue}try{const rec=await getMedia(key);if(!rec?.blob)continue;const url=URL.createObjectURL(rec.blob);mediaUrlCache.set(key,url);img.src=url}catch(e){console.warn('图片读取失败',key,e)}}}
async function migrateLegacyMedia(){
  // One-time migration: keep text metadata in localStorage, move binary images into IndexedDB.
  let migrated=0;
  for(const x of await all()){
    let changed=false;
    if(isDataImage(x.image)){x.image=await saveMedia(x.image);changed=true;migrated++}
    if(x.attachment&&isDataImage(x.attachment.data)){x.attachment.mediaKey=(await saveMedia(x.attachment.data)).slice(8);x.attachment.data=null;changed=true;migrated++}
    if(changed)await saveItem(x);
  }
  const photos=photoRecords();
  for(const p of photos)if(isDataImage(p.image)){p.image=await saveMedia(p.image);migrated++}
  if(photos.length)localStorage.setItem('cn-photo-wall',JSON.stringify(photos));
  const profile=profileData();
  if(isDataImage(profile.avatar)){profile.avatar=await saveMedia(profile.avatar);localStorage.setItem('cn-photo-profile',JSON.stringify(profile));migrated++}
  const posts=diaryPosts();
  for(const p of posts)if(isDataImage(p.image)){p.image=await saveMedia(p.image);migrated++}
  if(posts.length)localStorage.setItem('cn-diary',JSON.stringify(posts));
  if(migrated)console.info('CardNest 已迁移图片到 IndexedDB：',migrated);
}
function watchMediaImages(){const root=document.body;if(!root||root.__mediaObserver)return;const ob=new MutationObserver(()=>hydrateMediaImages(root));ob.observe(root,{childList:true,subtree:true});root.__mediaObserver=ob;hydrateMediaImages(root)}
watchMediaImages();

function all(){return new Promise((res,rej)=>{let r=store().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){items=await all()}
function saveItem(obj){return new Promise((res,rej)=>{let r=store('readwrite').put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function deleteItem(id){return new Promise((res,rej)=>{let r=store('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2300)}

function home(){let chars=items.filter(x=>x.type==='character'),recent=[...items].sort((a,b)=>b.created-a.created).slice(0,3),rec=dailyRecommendation();return `<section class="hero glass"><div><div class="eyebrow">YOUR PRIVATE COLLECTION</div><h1>把喜欢的，慢慢收藏。</h1><p>收集角色、灵感与工具，等想玩的时候再打开。</p></div><div class="hero-actions"><button class="btn primary" onclick="openAdd()">＋ 添加资源</button><button class="btn" onclick="document.getElementById('fileInput').click()">↑ 导入文件</button><button class="btn" onclick="randomDraw()">✧ 随机抽卡</button></div></section><section class="stats"><div class="stat glass"><span>全部收藏</span><strong>${items.length}</strong></div><div class="stat glass"><span>角色卡</span><strong>${chars.length}</strong></div><div class="stat glass"><span>待游玩</span><strong>${chars.filter(x=>(x.status||'待游玩')==='待游玩').length}</strong></div><div class="stat glass"><span>已整理 / 未整理</span><strong>${items.filter(x=>x.classified).length} / ${items.filter(x=>!x.classified).length}</strong></div></section><div class="section-head"><div><h2>今日推荐</h2><p>每天从你的角色卡中稳定推荐一张，不调用 AI</p></div><button class="btn small" onclick="dailyRecommendation(true);render()">换一张</button></div>${rec?`<section class="glass discovery-card">${rec.image?`<div class="cover"><img src="${mediaSrc(rec.image)}"></div>`:`<div class="cover">♙</div>`}<div style="min-width:0;flex:1"><div class="eyebrow">DAILY PICK</div><h3 style="margin:4px 0">${esc(rec.name)}</h3><p class="sub">${esc(rec.author||'未填写作者')} · ${esc(rec.folder||'未分类')}</p><div class="toolbar" style="margin:10px 0 0"><button class="btn primary small" onclick="openDetail('${rec.id}')">查看角色卡</button><button class="btn small" onclick="randomDraw()">随机抽卡</button></div></div></section>`:`<div class="glass empty">导入角色卡后即可生成每日推荐。</div>`}<div class="section-head"><div><h2>最近添加</h2><p>最近收进收藏馆的资源</p></div><button class="btn small" onclick="showPage('warehouse')">进入仓库 →</button></div>${recent.length?`<div class="grid">${recent.map(card).join('')}</div>`:`<div class="glass empty"><div class="big">✧</div><b>收藏馆还是空的</b><p>先添加一张角色卡，开始建立你的私人资源库吧。</p><button class="btn primary" onclick="openAdd()">添加第一份收藏</button></div>`}<div class="section-head"><div><h2>快捷入口</h2><p>按资源类型整理</p></div></div><div class="folder-grid">${resourceTypes.map(([id,ic,n])=>`<div class="glass folder-tile" onclick="showPage('warehouse');setTimeout(()=>warehouseType('${id}'),0)"><div class="eyebrow">${ic}</div><h3>${n}</h3><div class="sub">${items.filter(x=>x.type===id).length} 份收藏</div></div>`).join('')}</div>`}

function warehouse(){let folders=[...new Set(items.map(x=>(x.folder||'未分类').trim()||'未分类'))];return `<div class="section-head"><div><h2>收藏仓库</h2><p>先按资源类型进入，再按大文件夹整理</p></div><button class="btn primary" onclick="openAdd()">＋ 添加资源</button></div><div class="toolbar"><input class="field search" placeholder="搜索整个仓库…" value="${esc(query)}" oninput="query=this.value;render()"><button class="btn" onclick="aiClassifyAll()">✧ AI 整理未分类</button><button class="btn" onclick="randomDraw()">随机抽卡</button></div><div class="folder-grid">${resourceTypes.map(([id,ic,n])=>`<div class="glass folder-tile" onclick="warehouseType('${id}')"><div class="eyebrow">${ic} RESOURCE TYPE</div><h3>${n}</h3><div class="sub">${items.filter(x=>x.type===id).length} 项 · ${new Set(items.filter(x=>x.type===id).map(x=>x.folder||'未分类')).size} 个文件夹</div></div>`).join('')}</div><div class="section-head"><div><h2>大文件夹</h2><p>AI 分类只处理未整理项目；已整理的不会重复消耗 tokens</p></div></div><div class="folder-grid">${folders.map((f,fi)=>{let n=items.filter(x=>(x.folder||'未分类')===f).length;return `<div class="glass folder-tile" onclick="warehouseFolderByIndex(${fi})"><span class="folder-tag">${items.some(x=>(x.folder||'未分类')===f&&x.classified)?'✓ 已整理':'○ 待整理'}</span><h3>📁 ${esc(f)}</h3><div class="sub">${n} 项收藏</div></div>`}).join('')}</div><div class="section-head"><div><h2>未整理收藏</h2><p>本地标记，不调用 AI</p></div><button class="btn small" onclick="markAllClassified()">全部标记已整理</button></div>${items.some(x=>!x.classified)?`<div class="grid">${items.filter(x=>!x.classified).slice(0,12).map(card).join('')}</div>`:`<div class="glass empty">全部收藏都已整理。</div>`}`}
function warehouseType(type){page='warehouse';render();const list=items.filter(x=>x.type===type);document.getElementById('view').innerHTML=`<div class="section-head"><button class="btn small" onclick="render()">← 仓库</button><div><h2>${names[type]||type}</h2><p>${list.length} 项收藏</p></div><button class="btn primary" onclick="openAdd('${type}')">＋ 添加</button></div><div class="toolbar"><input class="field search" placeholder="搜索名称、标签、作者…" oninput="this.parentElement.nextElementSibling.innerHTML=items.filter(x=>x.type==='${type}'&&(x.name+' '+(x.tags||[]).join(' ')).toLowerCase().includes(this.value.toLowerCase())).map(card).join('')"></div><div class="grid">${list.map(card).join('')}</div>`}

function dailyCharacter(){let chars=items.filter(x=>x.type==='character');if(!chars.length)return null;let day=new Date().toISOString().slice(0,10),seed=[...day].reduce((a,c)=>a+c.charCodeAt(0),0);return chars[seed%chars.length]}
function dailyRecommendation(force=false){let chars=items.filter(x=>x.type==='character');if(!chars.length)return null;let day=new Date().toISOString().slice(0,10),last=localStorage.getItem('cn-daily-date'),idx=Number(localStorage.getItem('cn-daily-index')||0);if(force||last!==day){idx=force?(idx+1)%chars.length:([...day].reduce((a,c)=>a+c.charCodeAt(0),0)%chars.length);localStorage.setItem('cn-daily-date',day);localStorage.setItem('cn-daily-index',String(idx))}return chars[idx%chars.length]}

async function aiDiaryComments(id,selectedIds=null){let posts=diaryPosts(),post=posts.find(p=>p.id===id),chars=items.filter(x=>x.type==='character');if(!post||!chars.length){toast('需要先收藏角色卡');return}try{let chosen=selectedIds?chars.filter(x=>selectedIds.includes(x.id)):[...chars].sort(()=>Math.random()-.5).slice(0,Math.min(3,chars.length));let prompt={post:post.text,characters:chosen.map(x=>({id:x.id,name:x.name,description:(x.description||x.note||'').slice(0,500),tags:x.tags||[]}))};let answer=await callChatApi([{role:'system',content:'你是角色扮演评论生成助手。让给定角色根据各自人设自然地评论这条日记。每个角色输出一条简短中文评论，保持角色差异，不要替用户发言。只输出JSON数组，元素为{id,text}。'}, {role:'user',content:JSON.stringify(prompt)}]);let clean=answer.replace(/```(?:json)?/gi,'').replace(/```/g,'').trim(),arr=JSON.parse(clean);post.comments=(post.comments||[]).concat(arr.map(c=>{let x=chosen.find(a=>a.id===c.id);return {id:c.id,name:x?.name||'角色',image:x?.image||null,text:String(c.text||'')}}));saveDiary(posts);render();toast('角色评论已生成')}catch(e){toast('生成失败：'+e.message)}}

function getApiConfig(){try{return JSON.parse(localStorage.getItem('cn-api')||'{}')}catch{return {}}}
function saveApiConfig(){
  const cfg={base:(document.getElementById('api-base').value.trim()||'https://api.openai.com/v1').replace(/\/+$/,''),
    key:document.getElementById('api-key').value.trim(),model:document.getElementById('api-model').value.trim()||'gpt-4o-mini'};
  localStorage.setItem('cn-api',JSON.stringify(cfg));toast('API 配置已保存在本设备');
}
function populateApiConfig(){const c=getApiConfig();const b=document.getElementById('api-base'),k=document.getElementById('api-key'),m=document.getElementById('api-model');if(b){b.value=c.base||'';k.value=c.key||'';m.value=c.model||''}}
async function callChatApi(messages){
  const c=getApiConfig();if(!c.key||!c.base||!c.model)throw Error('请先在设置中填写 API Base URL、Key 和模型');
  const r=await fetch(c.base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},body:JSON.stringify({model:c.model,temperature:0.2,messages})});
  if(!r.ok)throw Error('API 请求失败：HTTP '+r.status);
  const d=await r.json();return d.choices?.[0]?.message?.content||'';
}
async function testApiConfig(){
  try{saveApiConfig();const out=await callChatApi([{role:'user',content:'Reply with exactly OK'}]);toast(out.trim().slice(0,60)||'连接成功')}catch(e){toast(e.message)}
}
async function aiClassifyAll(){
  const pending=items.filter(x=>!x.classified);if(!pending.length){toast('所有收藏都已整理，无需调用 API');return}
  if(!confirm(`将仅整理 ${pending.length} 条未分类收藏，已整理项目不会消耗 tokens。继续？`))return;
  try{
    const batch=pending.map(x=>({id:x.id,name:x.name,type:x.type,description:(x.description||x.note||'').slice(0,900),tags:x.tags||[],folder:x.folder||''}));
    const answer=await callChatApi([{role:'system',content:'你是收藏资源整理助手。根据输入的资源，为每条返回JSON数组，元素字段为id, folder, tags, type。type只能是character/preset/tool/inspiration/chat；folder必须从以下少量大类中选择，避免创建过多文件夹：现代/都市、古风/历史、奇幻/超自然、科幻/未来、校园/青春、恋爱/日常、悬疑/惊悚、其他；tags为最多5个短标签。只输出JSON，不要Markdown。不得改变id。'},
      {role:'user',content:JSON.stringify(batch)}]);
    const clean=answer.replace(/```(?:json)?/gi,'').replace(/```/g,'').trim();
    const arr=JSON.parse(clean);
    for(const row of arr){const x=items.find(a=>a.id===row.id);if(!x)continue;if(row.folder)x.folder=String(row.folder);if(Array.isArray(row.tags))x.tags=[...new Set(row.tags.map(String))];if(['character','preset','tool','inspiration','chat'].includes(row.type))x.type=row.type;x.classified=true;await saveItem(x)}
    await load();render();toast('AI 分类完成');
  }catch(e){toast('AI 分类失败：'+e.message)}
}
async function moveItem(id,delta){
  const sorted=[...items].sort((a,b)=>(a.order??a.created)-(b.order??b.created));
  const i=sorted.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=sorted.length){toast('已经到达列表边界');return}
  const a=sorted[i],b=sorted[j],ao=a.order??i,bo=b.order??j;a.order=bo;b.order=ao;
  await saveItem(a);await saveItem(b);await load();openDetail(id);toast('顺序已调整');
}

ue)">${esc(x.ideas||'')}</textarea></div><div class="glass editbox"><h3>★ 个人评分</h3><div style="font-size:25px;letter-spacing:4px">${[1,2,3,4,5].map(n=>`<button style="background:none;color:${n<=(x.rating||0)?'var(--accent)':'var(--muted)'};font-size:25px;padding:0" onclick="updateField('${id}','rating',${n});openDetail('${id}')">★</button>`).join('')}</div><small style="color:var(--muted)">${x.rating||0}/5</small></div><div class="glass editbox"><h3>☷ 简介 / 备注</h3><textarea placeholder="补充说明…" onchange="updateField('${id}','note',this.value)">${esc(x.note||'')}</textarea></div><div class="glass editbox wide"><h3>▤ 聊天记录 / 剧情存档备注</h3><textarea placeholder="可以粘贴聊天片段、存档说明或剧情进度…" onchange="updateField('${id}','chatlog',this.value)">${esc(x.chatlog||'')}</textarea></div><div class="glass editbox wide"><h3>关联附件</h3><div style="font-size:13px;color:var(--muted)">${x.attachment?`${esc(x.attachment.name)} · ${(x.attachment.size/1024).toFixed(1)} KB`:'尚未添加附件'}</div></div></div></section>`}

async function exportBackup(){const backupItems=[];for(const item of items){const x=JSON.parse(JSON.stringify(item));if(isMediaRef(x.image))x.image=await mediaRefToData(x.image);if(x.attachment?.mediaKey){x.attachment.data=await mediaRefToData('media://'+x.attachment.mediaKey);delete x.attachment.mediaKey}backupItems.push(x)}const photos=[];for(const p of photoRecords()){const x={...p};if(isMediaRef(x.image))x.image=await mediaRefToData(x.image);photos.push(x)}const profile={...profileData()};if(isMediaRef(profile.avatar))profile.avatar=await mediaRefToData(profile.avatar);const posts=[];for(const p of diaryPosts()){const x={...p};if(isMediaRef(x.image))x.image=await mediaRefToData(x.image);posts.push(x)}const data={app:'CardNest',version:2,exportedAt:new Date().toISOString(),items:backupItems,photos,profile,posts};let blob=new Blob([JSON.stringify(data)],{type:'application/json'});downloadBlob(blob,'CardNest-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('完整备份文件已生成')}

function decodeBase64Utf8(value){
  try{
    const clean=value.replace(/\s/g,'');
    const bin=atob(clean);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    return new TextDecoder('utf-8',{fatal:false}).decode(bytes);
  }catch{return value}
}
async function inflateBytes(bytes,format='deflate'){
  if(!('DecompressionStream'in window))return null;
  try{
    const ds=new DecompressionStream(format);
    return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
  }catch{return null}
}
async function parseMetaText(value){
  if(!value)return null;
  let candidates=[value];
  const b64=decodeBase64Utf8(value);
  if(b64!==value)candidates.push(b64);
  for(const c of [...candidates]){
    const trimmed=c.trim();
    try{return JSON.parse(trimmed)}catch{}
    // Some card formats wrap JSON in base64, optionally compressed.
    try{
      const raw=Uint8Array.from(atob(trimmed.replace(/\s/g,'')),x=>x.charCodeAt(0));
      for(const fmt of ['deflate','gzip']){
        const inflated=await inflateBytes(raw,fmt);
        if(inflated){const txt=new TextDecoder().decode(inflated);try{return JSON.parse(txt)}catch{}}
      }
      const txt=new TextDecoder().decode(raw);try{return JSON.parse(txt)}catch{}
    }catch{}
  }
  return null;
}
async function readPngCharacter(file){
  const bytes=new Uint8Array(await file.arrayBuffer());
  const sig=[137,80,78,71,13,10,26,10];
  if(bytes.length<8||!sig.every((v,i)=>bytes[i]===v))return null;
  const dec=new TextDecoder('utf-8');let off=8,found=[];
  while(off+12<=bytes.length){
    const len=(bytes[off]*0x1000000)+(bytes[off+1]<<16)+(bytes[off+2]<<8)+bytes[off+3];
    if(!Number.isSafeInteger(len)||len<0||off+12+len>bytes.length)break;
    const type=dec.decode(bytes.slice(off+4,off+8)),data=bytes.slice(off+8,off+8+len);
    if(type==='tEXt'){
      const z=data.indexOf(0);
      if(z>=0){const key=dec.decode(data.slice(0,z)).toLowerCase();if(['chara','character','ccv3'].includes(key))found.push(dec.decode(data.slice(z+1)))}
    }else if(type==='iTXt'){
      const z=data.indexOf(0);
      if(z>=0){
        const key=dec.decode(data.slice(0,z)).toLowerCase();
        if(['chara','character','ccv3'].includes(key)){
          let i=z+1,compressed=data[i++],method=data[i++];while(i<data.length&&data[i++]!==0){}while(i<data.length&&data[i++]!==0){}
          let payload=data.slice(i);
          if(compressed===1){const out=await inflateBytes(payload,'deflate');if(out)payload=out}
          found.push(dec.decode(payload));
        }
      }
    }else if(type==='zTXt'){
      const z=data.indexOf(0);
      if(z>=0&&['chara','character','ccv3'].includes(dec.decode(data.slice(0,z)).toLowerCase())){
        const out=await inflateBytes(data.slice(z+2),'deflate');
        if(out)found.push(dec.decode(out));
      }
    }
    off+=12+len;if(type==='IEND')break;
  }
  for(const val of found){const parsed=await parseMetaText(val);if(parsed)return parsed}
  return null;
}
function normalizeCharacter(raw,file){
  const d=raw?.data||raw?.character||raw||{};
  const name=d.name||raw?.name||file.name.replace(/\.[^.]+$/,'');
  const desc=[d.description,d.personality,d.scenario,raw?.description].filter(v=>typeof v==='string'&&v.trim()).join('\n\n');
  const tags=Array.isArray(d.tags)?d.tags:[];
  return {name,description:desc,author:d.creator||d.author||raw?.creator||'',tags,raw};
}
async function importFiles(files){
  let added=0;
  for(const f of files){
    const ext=f.name.split('.').pop().toLowerCase();
    let raw=null;
    if(ext==='json'){try{raw=JSON.parse(await f.text())}catch{}}
    else if(ext==='png'){raw=await readPngCharacter(f)}
    const parsed=normalizeCharacter(raw||{},f);
    const isImage=f.type.startsWith('image/');
    const data=await fileToData(f);
    const mediaImage=isImage?await saveMedia(await compressImage(f)):null;const attachment=isImage?{name:f.name,type:f.type,size:f.size,mediaKey:(await saveMedia(f)).slice(8),data:null}:{name:f.name,type:f.type,size:f.size,data};const x={id:uid(),type:'character',name:parsed.name,author:parsed.author||'文件导入',url:'',tags:[...new Set(['文件导入',...parsed.tags])],status:'待游玩',folder:'未整理',classified:false,order:Date.now(),note:'',description:parsed.description,created:Date.now(),image:mediaImage,attachment,raw:raw||null,repo:'',ideas:'',rating:0,chatlog:''};
    await saveItem(x);added++;
  }
  await load();showPage('character');toast('已导入 '+added+' 张卡片');
}

  const files=[...e.target.files];if(!files.length)return;
  document.getElementById('modal').innerHTML=`<h2>批量导入</h2><p class="import-hint">正在解析 ${files.length} 个文件。支持酒馆 PNG（含角色元数据）、JSON 角色卡，以及图片作为封面/原帖截图保存。解析后可在详情页补充标签与笔记。</p><div class="import-preview">${files.slice(0,8).map(f=>`<div class="preview-item"><b>${esc(f.name)}</b><span>${(f.size/1024).toFixed(0)} KB</span></div>`).join('')}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="doImport">导入 ${files.length} 个文件</button></div>`;
  showModal();document.getElementById('doImport').onclick=async()=>{const b=document.getElementById('doImport');b.disabled=true;b.textContent='正在导入…';try{await importFiles(files);closeModal()}catch(err){toast('导入失败：'+err.message);b.disabled=false;b.textContent='重试导入'}};
  e.target.value='';
});
document.getElementById('backupInput').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.items))throw Error('格式错误');if(!confirm('导入 '+d.items.length+' 条记录？同 ID 项目将被覆盖。'))return;for(let x of d.items){if(isDataImage(x.image))x.image=await saveMedia(x.image);if(x.attachment&&isDataImage(x.attachment.data)){x.attachment.mediaKey=(await saveMedia(x.attachment.data)).slice(8);x.attachment.data=null}await saveItem(x)}if(Array.isArray(d.photos)){for(const p of d.photos)if(isDataImage(p.image))p.image=await saveMedia(p.image);savePhotoRecords(d.photos)}if(d.profile){if(isDataImage(d.profile.avatar))d.profile.avatar=await saveMedia(d.profile.avatar);saveProfileData(d.profile)}if(Array.isArray(d.posts)){for(const p of d.posts)if(isDataImage(p.image))p.image=await saveMedia(p.image);saveDiary(d.posts)}await load();showPage('home');toast('备份导入完成')}catch(err){toast('备份文件无法识别：'+err.message)}e.target.value=''});

function render(){nav();document.getElementById('crumb').textContent='私人收藏馆 / '+names[page];let v=document.getElementById('view');if(page==='home')v.innerHTML=home();else if(page==='warehouse')v.innerHTML=warehouse();else if(page==='diary')v.innerHTML=diaryPage();else if(page==='photos')v.innerHTML=photoPage();else if(page==='settings')v.innerHTML=settings();else if(page==='tags')v.innerHTML=tagPage();else if(page==='todo')v.innerHTML=listPage('character',true);else v.innerHTML=listPage(page,false);if(page==='settings')populateApiConfig()}

function photoRecords(){try{return JSON.parse(localStorage.getItem('cn-photo-wall')||'[]')}catch{return []}}

function profileData(){try{return JSON.parse(localStorage.getItem('cn-photo-profile')||'{}')}catch{return {}}}

function photoPage(){let p=profileData(),all=photoRecords(),filter=localStorage.getItem('cn-photo-filter')||'全部',rows=filter==='全部'?all:all.filter(x=>x.category===filter);let avatar=p.avatar?`<img src="${mediaSrc(p.avatar)}">`:'✧';return `<div class="ig-page"><div class="ig-top"><b>照片墙</b><button class="ig-add" onclick="openPhotoAdd()">＋</button></div><section class="ig-profile"><div class="ig-profile-top"><div class="ig-avatar">${avatar}</div><div class="ig-stats"><div><b>${all.length}</b><span>posts</span></div><div><b>${Number(p.followers||0)}</b><span>followers</span></div><div><b>${Number(p.following||0)}</b><span>following</span></div></div></div><div class="ig-bio"><b>${esc(p.name||'CardNest 用户')}</b><p>${esc(p.bio||'记录喜欢的角色、头像与灵感。')}</p><button class="ig-edit" onclick="editPhotoProfile()">编辑个人资料</button></div></section><div class="ig-highlights"><div class="ig-highlight"><span>✧</span><small>我的收藏</small></div><div class="ig-highlight"><span>♡</span><small>角色头像</small></div><div class="ig-highlight"><span>▧</span><small>灵感碎片</small></div></div><div class="ig-tabs"><span class="active">▦</span><span>♙</span><span>▤</span></div><div class="ig-categories">${['全部','我的头像','角色头像','灵感','其他'].map(c=>`<button class="${filter===c?'active':''}" onclick="setPhotoFilter('${c}')">${c}</button>`).join('')}</div><div class="ig-grid">${rows.map((x,i)=>`<button class="ig-photo" onclick="viewPhoto('${x.id}')"><img src="${mediaSrc(x.image)}" alt="${esc(x.title||'照片')}"><span>${x.ownerType==='char'?'♙':''}</span></button>`).join('')}</div>${!rows.length?'<div class="ig-empty">还没有照片。点击右上角＋，上传用户或角色头像。</div>':''}</div>`}
function setPhotoFilter(v){localStorage.setItem('cn-photo-filter',v);render()}
function openPhotoAdd(){let chars=items.filter(x=>x.type==='character');document.getElementById('modal').innerHTML=`<h2>添加照片</h2><div class="formgrid"><div class="formrow full"><label>照片来源</label><select class="field" id="ph-owner" onchange="document.getElementById('ph-char-row').classList.toggle('hidden',this.value!=='char');document.getElementById('ph-file-row').classList.toggle('hidden',this.value==='char')"><option value="user">我的照片 / 头像</option><option value="char">从角色卡选择头像</option></select></div><div class="formrow full" id="ph-char-row" class="hidden"><label>选择角色卡</label><select class="field" id="ph-char">${chars.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="formrow full" id="ph-file-row"><label>上传图片</label><input class="field" id="ph-file" type="file" accept="image/*"></div><div class="formrow"><label>图片分类</label><select class="field" id="ph-category"><option>我的头像</option><option>角色头像</option><option>灵感</option><option>其他</option></select></div><div class="formrow"><label>图片标题</label><input class="field" id="ph-title" placeholder="可选"></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="savePhoto()">添加到照片墙</button></div>`;showModal();document.getElementById('ph-char-row').classList.add('hidden')}
async function compressImage(file,max=1400){let data=await fileToData(file);return new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.84))};im.onerror=reject;im.src=data})}
async function savePhoto(){try{let owner=document.getElementById('ph-owner').value,image=null,ownerId=null,ownerName='';if(owner==='char'){let x=items.find(a=>a.id===document.getElementById('ph-char').value);if(!x?.image)throw Error('所选角色卡没有封面头像');image=x.image;ownerId=x.id;ownerName=x.name}else{let f=document.getElementById('ph-file').files[0];if(!f)throw Error('请选择一张图片');image=await compressImage(f)}if(isDataImage(image))image=await saveMedia(image);let arr=photoRecords();arr.unshift({id:uid(),image,ownerType:owner==='char'?'char':'user',ownerId,ownerName,title:document.getElementById('ph-title').value.trim(),category:document.getElementById('ph-category').value,created:Date.now()});savePhotoRecords(arr);if(owner==='user'&&document.getElementById('ph-category').value==='我的头像'){let p=profileData();p.avatar=image;saveProfileData(p)}closeModal();showPage('photos');toast('已添加到照片墙')}catch(e){toast(e.name==='QuotaExceededError'?'浏览器存储空间不足，请清理设备空间后重试':e.message)}}
function editPhotoProfile(){let p=profileData();document.getElementById('modal').innerHTML=`<h2>编辑个人资料</h2><div class="formgrid"><div class="formrow full"><label>昵称</label><input class="field" id="ig-name" value="${esc(p.name||'CardNest 用户')}"></div><div class="formrow full"><label>个人简介 Bio</label><textarea class="field" id="ig-bio">${esc(p.bio||'')}</textarea></div><div class="formrow"><label>Followers</label><input class="field" id="ig-followers" type="number" min="0" value="${Number(p.followers||0)}"></div><div class="formrow"><label>Following</label><input class="field" id="ig-following" type="number" min="0" value="${Number(p.following||0)}"></div><div class="formrow full"><label>更换头像</label><input class="field" id="ig-avatar-file" type="file" accept="image/*"></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="savePhotoProfile()">保存</button></div>`;showModal()}
async function savePhotoProfile(){let p=profileData(),f=document.getElementById('ig-avatar-file').files[0];p.name=document.getElementById('ig-name').value.trim();p.bio=document.getElementById('ig-bio').value;p.followers=Number(document.getElementById('ig-followers').value||0);p.following=Number(document.getElementById('ig-following').value||0);if(f)p.avatar=await saveMedia(await compressImage(f,700));saveProfileData(p);closeModal();render()}
function viewPhoto(id){let x=photoRecords().find(a=>a.id===id);if(!x)return;document.getElementById('modal').innerHTML=`<div class="ig-view"><button class="btn" onclick="closeModal()">✕</button><img src="${mediaSrc(x.image)}"><div><b>${esc(x.title||x.ownerName||'照片')}</b><p class="sub">${esc(x.category)} · ${new Date(x.created).toLocaleDateString()}</p><button class="btn" onclick="deletePhoto('${id}')">删除照片</button></div></div>`;showModal()}
function deletePhoto(id){if(!confirm('删除这张照片？'))return;savePhotoRecords(photoRecords().filter(x=>x.id!==id));closeModal();render()}

function getCardModules(x){let r=x.raw||{},d=r.data||r.character||r,ext=d.extensions||r.extensions||{},book=d.character_book||d.worldbook||d.lorebook||r.character_book||{};let wb=book.entries||book;let world=Array.isArray(wb)?wb:Object.values(wb||{});let greetings=[d.first_mes,d.first_message,...(Array.isArray(d.alternate_greetings)?d.alternate_greetings:[])].filter(v=>typeof v==='string'&&v.trim());let regex=d.regex_scripts||ext.regex_scripts||r.regex_scripts||[];if(!Array.isArray(regex))regex=Object.values(regex||{});let qr=d.quick_replies||ext.quick_replies||r.quick_replies||[];if(!Array.isArray(qr))qr=Object.values(qr||{});return {worldbook:world,greetings,regexes:regex,qrs:qr}}
function moduleSwitches(id){let x=items.find(a=>a.id===id);if(!x)return;let m=getCardModules(x),cfg=x.moduleSettings||{worldbook:true,greetings:true,regexes:true,qrs:true};let defs=[['worldbook','世界书',m.worldbook.length],['greetings','开场白',m.greetings.length],['regexes','正则',m.regexes.length],['qrs','QR / 快捷回复',m.qrs.length]];return `<section class="glass module-panel"><div class="module-panel-head"><div><b>角色卡内置模块</b><p>选择游玩/AI 扮演时需要启用的内容</p></div><span class="sub">可单独开关</span></div><div class="module-switches">${defs.map(([k,n,count])=>`<label class="module-switch"><span><b>${n}</b><small>${count} 个条目</small></span><input type="checkbox" ${cfg[k]!==false?'checked':''} onchange="toggleCardModule('${id}','${k}',this.checked)"></label>`).join('')}</div><details class="module-preview"><summary>检查已识别内容</summary>${defs.map(([k,n,count])=>`<div class="module-preview-row"><b>${n} · ${count}</b><small>${count? '已从卡片文件中识别':'未在当前文件中识别到'}</small></div>`).join('')}</details></section>`}
async function toggleCardModule(id,key,on){let x=items.find(a=>a.id===id);x.moduleSettings=x.moduleSettings||{};x.moduleSettings[key]=on;await saveItem(x);toast((on?'已启用':'已关闭')+'该模块')}
function roleContext(x){let d=x.raw?.data||x.raw?.character||x.raw||{},m=getCardModules(x),cfg=x.moduleSettings||{};let ctx={name:x.name,description:x.description||d.description||'',personality:d.personality||'',scenario:d.scenario||'',creator_notes:d.creator_notes||'',first_mes:(cfg.greetings===false?[]:m.greetings).slice(0,2),tags:x.tags||[]};if(cfg.worldbook!==false)ctx.worldbook=m.worldbook.slice(0,12).map(e=>({name:e.name||e.comment,keys:e.keys||e.key,content:String(e.content||e.entry||'').slice(0,900)}));if(cfg.regexes!==false)ctx.regexes=m.regexes.slice(0,5);if(cfg.qrs!==false)ctx.quick_replies=m.qrs.slice(0,8);return ctx}

/* Replace detail view with a version that exposes per-card module toggles. */
async function openDetail(id){let x=items.find(a=>a.id===id);if(!x)return;current=id;page=x.type;nav();document.getElementById('crumb').textContent='私人收藏馆 / '+names[page]+' / 详情';let im=x.image?`<img src="${mediaSrc(x.image)}">`:({character:'♙',preset:'☷',tool:'⚒',inspiration:'✧',chat:'▤'}[x.type]||'◇');document.getElementById('view').innerHTML=`<div class="section-head"><button class="btn small" onclick="showPage('${x.type}')">← 返回列表</button><button class="btn small" onclick="editBasic('${id}')">编辑资料</button></div><section class="glass detail"><div class="detailtop"><div class="detailcover">${im}</div><div style="min-width:0;flex:1"><div class="eyebrow">${names[x.type]}</div><h1>${esc(x.name)}</h1><div class="detailmeta">${esc(x.author||'未填写作者')}${x.folder?' · 文件夹：'+esc(x.folder):''} · 收藏于 ${new Date(x.created).toLocaleDateString()}</div>${x.description?`<p style="color:var(--muted);font-size:13px;white-space:pre-wrap;max-height:180px;overflow:auto">${esc(x.description)}</p>`:''}<div class="chips">${(x.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}<span class="chip">${esc(x.status||'已收藏')}</span></div><div class="detail-actions">${x.url?`<button class="btn small" onclick="window.open('${esc(x.url)}','_blank','noopener')">↗ 打开来源</button>`:''}${x.attachment?`<button class="btn small" onclick="downloadAttachment('${id}')">↓ 下载附件</button>`:''}<button class="btn small" onclick="editBasic('${id}')">✎ 编辑</button><button class="btn small" onclick="moveItem('${id}',-1)">↑ 上移</button><button class="btn small" onclick="moveItem('${id}',1)">↓ 下移</button><button class="btn small" onclick="removeItem('${id}')">删除</button></div></div></div>${x.type==='character'?moduleSwitches(id):''}<div class="detailgrid"><div class="glass editbox"><h3>✎ Repo / 游玩评价</h3><textarea placeholder="写下完整评价、游玩感受…" onchange="updateField('${id}','repo',this.value)">${esc(x.repo||'')}</textarea></div><div class="glass editbox"><h3>✧ 我的想法 / 脑洞</h3><textarea placeholder="想尝试的剧情、人设、脑洞…" onchange="updateField('${id}','ideas',this.value)">${esc(x.ideas||'')}</textarea></div><div class="glass editbox"><h3>★ 个人评分</h3><div style="font-size:25px;letter-spacing:4px">${[1,2,3,4,5].map(n=>`<button style="background:none;color:${n<=(x.rating||0)?'var(--accent)':'var(--muted)'};font-size:25px;padding:0" onclick="updateField('${id}','rating',${n});openDetail('${id}')">★</button>`).join('')}</div><small style="color:var(--muted)">${x.rating||0}/5</small></div><div class="glass editbox"><h3>☷ 简介 / 备注</h3><textarea placeholder="补充说明…" onchange="updateField('${id}','note',this.value)">${esc(x.note||'')}</textarea></div><div class="glass editbox wide"><h3>▤ 聊天记录 / 剧情存档备注</h3><textarea placeholder="可以粘贴聊天片段、存档说明或剧情进度…" onchange="updateField('${id}','chatlog',this.value)">${esc(x.chatlog||'')}</textarea></div><div class="glass editbox wide"><h3>关联附件</h3><div style="font-size:13px;color:var(--muted)">${x.attachment?`${esc(x.attachment.name)} · ${(x.attachment.size/1024).toFixed(1)} KB`:'尚未添加附件'}</div></div></div></section>`}

/* X-like timeline with image posts, reactions and threaded replies. */
function diaryPosts(){try{return JSON.parse(localStorage.getItem('cn-diary')||'[]')}catch{return []}}
function saveDiary(posts){localStorage.setItem('cn-diary',JSON.stringify(posts))}
function diaryAvatar(){let p=profileData();return p.avatar?`<img src="${mediaSrc(p.avatar)}">`:'✧'}
function renderReplies(post,parent=null,depth=0){let arr=(post.comments||[]).filter(c=>(c.parentId||null)===parent);return arr.map(c=>`<div class="x-reply" style="margin-left:${Math.min(depth,3)*18}px"><div class="x-avatar">${c.image?`<img src="${mediaSrc(c.image)}">`:'♙'}</div><div class="x-reply-main"><div class="x-name">${esc(c.name)} <small>@${esc((c.name||'character').replace(/\s+/g,'').slice(0,16))} · ${new Date(c.created||Date.now()).toLocaleString()}</small></div><div class="x-text">${esc(c.text)}</div><button class="x-reply-btn" onclick="replyToComment('${post.id}','${c.id}')">回复</button>${renderReplies(post,c.id,depth+1)}</div></div>`).join('')}
function diaryPage(){let posts=diaryPosts(),p=profileData();return `<div class="x-page"><div class="x-topbar"><b>帖子</b><button class="x-more" onclick="editPhotoProfile()">•••</button></div><section class="x-compose"><div class="x-avatar">${diaryAvatar()}</div><div class="x-compose-main"><textarea id="diary-text" placeholder="有什么新鲜事？"></textarea><div id="diary-image-preview"></div><div class="x-compose-tools"><label class="x-upload">▧ 图片<input type="file" id="diary-image" accept="image/*" onchange="previewDiaryImage(this)"></label><span>公开 · 仅保存在本设备</span><button class="x-post-btn" onclick="publishDiary()">发帖</button></div></div></section><div class="x-feed-tabs"><b>为你推荐</b><span>最新</span></div>${posts.map(post=>`<article class="x-post"><div class="x-post-avatar">${diaryAvatar()}</div><div class="x-post-content"><div class="x-author">${esc(p.name||'我')} <small>@cardnest · ${new Date(post.created).toLocaleString()}</small><button onclick="deleteDiary('${post.id}')">•••</button></div><div class="x-post-text">${esc(post.text)}</div>${post.image?`<img class="x-post-image" src="${mediaSrc(post.image)}">`:''}<div class="x-actions"><button onclick="xCommentPrompt('${post.id}')">♡ <span>${(post.comments||[]).length}</span></button><button class="${post.reposted?'active':''}" onclick="togglePostFlag('${post.id}','reposted')">⇄ <span>${post.reposts||0}</span></button><button class="${post.liked?'active':''}" onclick="togglePostFlag('${post.id}','liked')">♥ <span>${post.likes||0}</span></button><button onclick="openRoleCommentPicker('${post.id}')">✧ 角色互动</button></div>${renderReplies(post)}<div class="x-inline-reply"><input id="reply-${post.id}" placeholder="发布你的回复…" onkeydown="if(event.key==='Enter')xAddComment('${post.id}')"><button onclick="xAddComment('${post.id}')">回复</button></div></div></article>`).join('')||'<div class="ig-empty">还没有帖子，写下第一条动态吧。</div>'}</div>`}
let diaryDraftImage=null;
async function previewDiaryImage(input){let f=input.files?.[0];if(!f)return;diaryDraftImage=await compressImage(f,1400);document.getElementById('diary-image-preview').innerHTML=`<img class="x-preview" src="${diaryDraftImage}"><button class="btn small" onclick="diaryDraftImage=null;document.getElementById('diary-image-preview').innerHTML='';document.getElementById('diary-image').value='';">移除图片</button>`}
async function publishDiary(){let el=document.getElementById('diary-text'),text=el.value.trim();if(!text&&!diaryDraftImage){toast('写点内容或添加图片再发布');return}let image=diaryDraftImage;if(isDataImage(image))image=await saveMedia(image);let posts=diaryPosts();posts.unshift({id:uid(),text,image,created:Date.now(),comments:[],likes:0,reposts:0,liked:false,reposted:false});saveDiary(posts);diaryDraftImage=null;render();toast('帖子已发布')}
function deleteDiary(id){if(!confirm('删除这条帖子？'))return;saveDiary(diaryPosts().filter(p=>p.id!==id));render()}
function togglePostFlag(id,key){let ps=diaryPosts(),p=ps.find(x=>x.id===id);if(!p)return;p[key]=!p[key];let n=key==='liked'?'likes':'reposts';p[n]=Math.max(0,(p[n]||0)+(p[key]?1:-1));saveDiary(ps);render()}
function xAddComment(id,parentId=null,textValue=null,role=null){let input=document.getElementById('reply-'+id),text=(textValue??input?.value??'').trim();if(!text){toast('先写下评论');return}let ps=diaryPosts(),p=ps.find(x=>x.id===id);p.comments=p.comments||[];p.comments.push({id:uid(),parentId,name:role?.name||profileData().name||'我',image:role?.image||profileData().avatar||null,text,created:Date.now()});saveDiary(ps);render()}
function xCommentPrompt(id){let t=prompt('写下评论');if(t)xAddComment(id,null,t)}
function replyToComment(postId,commentId){let t=prompt('回复这条评论');if(t)xAddComment(postId,commentId,t)}
async function aiDiaryComments(id,selectedIds=null){let posts=diaryPosts(),post=posts.find(p=>p.id===id),chars=items.filter(x=>x.type==='character');if(!post||!chars.length){toast('需要先收藏角色卡');return}try{let chosen=selectedIds?chars.filter(x=>selectedIds.includes(x.id)):[...chars].sort(()=>Math.random()-.5).slice(0,Math.min(3,chars.length));let promptData={post:post.text,characters:chosen.map(roleContext)};let answer=await callChatApi([{role:'system',content:'你是严格遵循角色卡设定的角色扮演助手。你必须读取每个角色提供的人设、场景、开场白，以及用户为该角色开启的世界书/正则/QR内容；这些资料是角色扮演依据。不要把角色设定复述成说明，不要串角色，不要替用户发言。根据帖子语境，以角色本人第一人称自然留言，每个角色一条简短、有辨识度的中文评论。只输出JSON数组，元素格式为{"id":"角色id","text":"评论内容"}。'}, {role:'user',content:JSON.stringify({post:post.text,characters:promptData.characters.map((c,i)=>({...c,id:chosen[i].id}))})}]);let clean=answer.replace(/```(?:json)?/gi,'').replace(/```/g,'').trim(),arr=JSON.parse(clean);post.comments=post.comments||[];post.comments.push(...arr.map(c=>{let x=chosen.find(a=>a.id===c.id);return {id:uid(),parentId:null,roleId:c.id,name:x?.name||'角色',image:x?.image||null,text:String(c.text||''),created:Date.now()}}));saveDiary(posts);render();toast('角色已根据启用的人设模块发表评论')}catch(e){toast('生成失败：'+e.message)}}

</script></body></html>
